<aside class="sidebar" aria-label="Navegación principal">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">L</span>
    <div>
      <div class="brand-name">LUA Studio</div>
      <div class="brand-sub">Gym Core</div>
    </div>
  </div>

  <nav class="nav-group">
    <span class="nav-label">Menú</span>
    @for (item of navItems; track item.ruta) {
      <button
        type="button"
        class="nav-item"
        [routerLink]="item.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.ruta === '/admin' }"
      >
        <app-icon [name]="item.icon" [size]="18" />
        <span>{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="sidebar-user">
    <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
    <div class="user-meta">
      <p class="user-name">{{ session.nombre() }}</p>
      <p class="user-role">{{ rolTexto() }}</p>
    </div>
    <button
      type="button"
      class="btn-icon"
      title="Cerrar sesión"
      aria-label="Cerrar sesión"
      (click)="cerrarSesion()"
    >
      <app-icon name="logout" [size]="18" />
    </button>
  </div>

  <p class="text-muted small text-center mb-0" style="margin-top: 12px">
    {{ version }}<br />{{ empresa }}
  </p>
</aside>

<div class="shell-main">
  <header class="topbar">
    <div class="brand-mobile">
      <span class="brand-mark" aria-hidden="true">L</span>
      <div>
        <div class="brand-name" style="font-size: 1.1rem">LUA Studio</div>
        <div class="brand-sub">Gym Core</div>
      </div>
    </div>
    <button
      type="button"
      class="btn-icon"
      title="Cerrar sesión"
      aria-label="Cerrar sesión"
      (click)="cerrarSesion()"
    >
      <app-icon name="logout" [size]="18" />
    </button>
  </header>

  <main>
    <router-outlet />
  </main>

  <nav class="bottom-nav" aria-label="Navegación inferior">
    @for (item of navBottom; track item.ruta) {
      <button
        type="button"
        [routerLink]="item.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.ruta === '/admin' }"
      >
        <app-icon [name]="item.icon" [size]="22" [stroke]="1.8" />
        <span>{{ item.label }}</span>
      </button>
    }
    <button type="button" (click)="cerrarSesion()">
      <app-icon name="logout" [size]="22" [stroke]="1.8" />
      <span>Salir</span>
    </button>
  </nav>
</div>
